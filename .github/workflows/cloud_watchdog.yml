name: Free cloud wake and status check
on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-watchdog
  cancel-in-progress: false
jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wake Render and verify actual worker status
        run: python scripts/check_cloud_status.py
