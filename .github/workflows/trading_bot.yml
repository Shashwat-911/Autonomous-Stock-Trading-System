name: Account reporting (Render owns trading)

on:
  schedule:
    - cron: '17 22 * * 1-5' # After both summer and winter market close; delay is harmless.
    - cron: '0 2 * * 0'    # Preserve the existing weekly model refresh.
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: account-report-publication
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY || secrets.APCA_API_KEY_ID || '' }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.APCA_API_SECRET_KEY || '' }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL || 'https://paper-api.alpaca.markets' }}
      ALPACA_FEED: ${{ secrets.ALPACA_FEED || 'iex' }}
      GIT_TOKEN: ${{ secrets.GIT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Weekly model refresh
        if: github.event.schedule == '0 2 * * 0'
        run: |
          pip install optuna
          python ml/run_pipeline.py
          git add ml/optimal_params.json ml/feature_importance.csv ml/meta_model.pkl
      - name: Publish validated account measurements (no trading or cleanup)
        run: python scripts/post_session.py
