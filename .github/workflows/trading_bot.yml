name: Render wake checks and daily reports

on:
  # Repeated short HTTP checks give the free Render web service several chances
  # to wake before the US session. This workflow never starts the trading bot.
  schedule:
    - cron: '*/15 12-21 * * 1-5'
    # 17:30 New York is 21:30 UTC during EDT and 22:30 UTC during EST.
    - cron: '30 21 * * 1-5'
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake-render:
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 12-21 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    concurrency:
      group: render-session-wake
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Wake the single trading service and check readiness
        env:
          RENDER_URL: https://autonomous-stock-trader.onrender.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 180 \
            --retry 4 --retry-all-errors --retry-delay 10 --retry-max-time 210 \
            "$RENDER_URL/health"
          echo
          ready=false
          for attempt in {1..6}; do
            status=$(curl --fail --silent --show-error --max-time 15 "$RENDER_URL/status" || true)
            if printf '%s' "$status" | python -c 'import json,sys; data=json.load(sys.stdin); assert data.get("execution_owner") == "render"; assert data.get("market_clock") in ("open", "closed")' 2>/dev/null; then
              echo "$status"
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            echo "Render is reachable but its broker-clock status did not become ready."
            exit 1
          fi
          python scripts/check_runtime.py

  publish-session:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && (github.event.schedule == '30 21 * * 1-5' || github.event.schedule == '30 22 * * 1-5'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: render-session-report
      cancel-in-progress: false
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY || secrets.APCA_API_KEY_ID || '' }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY || secrets.APCA_API_SECRET_KEY || '' }}
      ALPACA_BASE_URL: ${{ secrets.ALPACA_BASE_URL || 'https://paper-api.alpaca.markets/v2' }}
      ALPACA_FEED: ${{ secrets.ALPACA_FEED || 'iex' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install report dependencies
        run: pip install -r requirements.txt

      - name: Determine New York report date
        id: date
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python scripts/report_schedule.py \
            --event-name "$EVENT_NAME" \
            --event-schedule "$EVENT_SCHEDULE" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Skip the nonmatching daylight-saving schedule
        if: steps.date.outputs.report_required != 'true'
        run: echo "This UTC schedule does not map to the 5 PM New York report window."

      - name: Check the Alpaca exchange calendar
        if: steps.date.outputs.report_required == 'true'
        id: calendar
        run: |
          is_trading_day=$(python scripts/check_trading_day.py --date "${{ steps.date.outputs.date }}")
          echo "trading_day=$is_trading_day" >> "$GITHUB_OUTPUT"
          echo "${{ steps.date.outputs.date }} is a trading day: $is_trading_day"

      - name: Archive Render session log
        if: steps.date.outputs.report_required == 'true' && steps.calendar.outputs.trading_day == 'true'
        run: python scripts/fetch_render_session_log.py --date "${{ steps.date.outputs.date }}"

      - name: Fetch broker equity observations
        if: steps.date.outputs.report_required == 'true' && steps.calendar.outputs.trading_day == 'true'
        run: python scripts/fetch_alpaca_equity.py --today

      - name: Rebuild session metrics, chart, and README
        if: steps.date.outputs.report_required == 'true' && steps.calendar.outputs.trading_day == 'true'
        run: |
          python scripts/generate_session_report.py
          python scripts/generate_pnl_chart.py
          python scripts/update_readme.py

      - name: Commit and publish report artifacts
        if: steps.date.outputs.report_required == 'true' && steps.calendar.outputs.trading_day == 'true'
        run: |
          set -euo pipefail
          git config user.email "shashwatyadav975@gmail.com"
          git config user.name "SHASHWAT YADAV"
          git add outputs/logs/ outputs/alpaca_equity_history.csv \
            outputs/performance_summary.json outputs/trade_history.csv \
            outputs/session_all_orders.csv outputs/daily_pnl_chart.png outputs/measurement_v2/ README.md
          if git diff --cached --quiet; then
            echo "No report artifacts changed."
            exit 0
          fi
          git commit -m "data(session): archive ${{ steps.date.outputs.date }} report [skip render]"
          git pull --rebase origin main
          git push origin HEAD:main
