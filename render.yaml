services:
  - type: web
    name: autonomous-stock-trader
    runtime: python
    plan: free
    region: oregon                    # us-west-2 — lowest latency to Alpaca US servers

    # -- Build ------------------------------------------------------------------
    buildCommand: pip install -r requirements.txt

    # -- Start ------------------------------------------------------------------
    startCommand: python scripts/cloud_launcher.py
    healthCheckPath: /ready

    # -- Auto-deploy on git push ------------------------------------------------
    autoDeploy: true

    # Report and documentation commits must not restart the live trader.
    buildFilter:
      ignoredPaths:
        - .github/**
        - outputs/**
        - README.md
        - docs/**
        - research/**
        - tests/**
        - scripts/check_trading_day.py
        - scripts/fetch_render_session_log.py
        - scripts/report_schedule.py

    # -- Environment Variables --------------------------------------------------
    envVars:
      - key: PORT
        value: "10000"

      - key: ALPACA_API_KEY
        sync: false

      - key: ALPACA_SECRET_KEY
        sync: false

      - key: ALPACA_BASE_URL
        value: https://paper-api.alpaca.markets/v2

      - key: ALPACA_FEED
        value: iex

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_CHAT_ID
        sync: false

      - key: GIT_TOKEN
        sync: false

      - key: PYTHON_VERSION
        value: "3.11.0"
